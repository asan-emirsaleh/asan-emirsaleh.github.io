<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Description }}">
  <title>{{ .Title }} · {{ .Site.Title }}</title>
  <link rel="stylesheet" href="./vendor/reveal/reveal.css">
  <link rel="stylesheet" href="./deck.css">
</head>
<body>
  <main class="reveal" aria-label="{{ .Title }}">
    <div class="slides">{{ .Content }}</div>
  </main>
  <dialog id="figure-zoom" aria-label="Изображение крупно"><button id="close-zoom" aria-label="Закрыть изображение">×</button><img id="zoom-image" alt=""></dialog>
  <script src="./vendor/reveal/reveal.js"></script>
  <script src="./deck.js"></script>
</body>
</html>
